[package]
name = "context-api"
version = "0.1.0"
edition = "2024"
description = "Command API of the context stack: graph store, read, search, render"

[features]
default = ["logs"]
ts-gen = ["ts-rs"]
# Trace capture and log queries (`<graph>.ctx.logs/`).
logs = ["jaq-core", "jaq-std", "jaq-interpret", "jaq-syn", "regex", "once_cell"]

[dependencies]
context-trace = { path = "../context-trace", default-features = false }
context-search = { path = "../context-search", default-features = false }
context-read = { path = "../context-read", default-features = false }
ascii-dag = "0.9"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
thiserror = "2"
fs2 = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"

schemars = "1"
ts-rs = { version = "10", features = ["serde-json-impl"], optional = true }

regex = { version = "1", optional = true }
once_cell = { version = "1", optional = true }
jaq-core = { version = "1", optional = true }
jaq-std = { version = "1", optional = true }
jaq-interpret = { version = "1", optional = true }
jaq-syn = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"
context-trace = { path = "../context-trace", default-features = false, features = ["test-api"] }
ngrams = { path = "../ngrams" }
