[workspace]
resolver = "2"
members = [
  "context-api",
  "context-insert",
  "context-read",
  "context-search",
  "context-trace",
  "context-trace-macros",
  "ngrams",
  "tools/cli/context-cli",
  "tools/mcp/context-mcp",
  "tools/http/context-http",
  "tools/context-editor/kernel",
  "tools/context-editor/sandbox-app",
]
exclude = ["./deps/petgraph", "./deps/justlog"]

[profile.dev]
debug = true
opt-level = 0

[profile.release]
opt-level = 2

[workspace.metadata.context-stack]
members = [
  "context-api",
  "context-insert",
  "context-read",
  "context-search",
  "context-trace",
  "context-trace-macros",
  "ngrams",
  "tools/cli/context-cli",
  "tools/mcp/context-mcp",
  "tools/http/context-http",
  "tools/context-editor/kernel",
  "tools/context-editor/sandbox-app",
]
ticket_workspace = ".ticket"
submodule_path = "context-stack"
