[package]
name = "context-cli"
version = "0.1.0"
edition = "2024"
description = "Command-line tool for context-engine graphs (positioned stack)"

[[bin]]
name = "context-cli"
path = "src/main.rs"

[features]
default = ["server", "mcp"]
# `context-cli serve`: the HTTP/WebSocket server of context-http.
server = ["dep:context-http", "dep:tokio", "dep:tracing-subscriber"]
# `context-cli mcp`: the MCP server of context-mcp (local or proxy mode).
mcp = ["dep:context-mcp", "dep:tokio", "dep:tracing-subscriber"]

[dependencies]
context-api = { path = "../../../context-api", features = ["client"] }
context-http = { path = "../../http/context-http", optional = true }
context-mcp = { path = "../../mcp/context-mcp", optional = true }
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
globset = "0.4"
base64 = "0.22"
rustyline = { version = "19", default-features = false, features = ["with-file-history"] }
shell-words = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
context-trace = { path = "../../../context-trace", default-features = false, features = ["test-api"] }
rmcp = { version = "0.14", features = ["client"] }
tokio = { version = "1", features = ["full"] }
regex = "1"
