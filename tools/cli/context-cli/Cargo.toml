[package]
name = "context-cli"
version = "0.1.0"
edition = "2024"
description = "Command-line tool for context-engine graphs (positioned stack)"

[[bin]]
name = "context-cli"
path = "src/main.rs"

[dependencies]
context-api = { path = "../../../context-api" }
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
globset = "0.4"
base64 = "0.22"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
context-trace = { path = "../../../context-trace", default-features = false, features = ["test-api"] }
