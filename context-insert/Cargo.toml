[package]
name = "context-insert"
version = "0.1.0"
edition = "2024"

[lib]

[features]
default = ["legacy"]
# Row-model implementation in `context_insert::legacy`.
legacy = ["context-search/legacy", "context-trace/legacy"]
# Run the legacy row-model test suite (ignored by default).
legacy-tests = [
    "legacy",
    "context-search/legacy-tests",
    "context-trace/legacy-tests",
]
test-api = ["context-trace/test-api", "context-search/test-api"]

[dependencies]
derive-new = "0.7.0"
derive_more = { version = "2", features = ["full"] }
itertools = "0.14"
linked-hash-map = "0.5"
linked_hash_set = "0.1"
derivative = "2.2"
maplit = "1.0"
pretty_assertions = "1.4"
tracing = { version = "^0.1", features = ["attributes", "valuable"] }
tracing-subscriber = "0.3"

context-search = { path = "../context-search", default-features = false }
context-trace = { path = "../context-trace", default-features = false, features = ["edit"] }

[dev-dependencies]
context-search = { path = "../context-search", default-features = false, features = ["test-api"] }
context-trace = { path = "../context-trace", default-features = false, features = ["test-api", "edit"] }
